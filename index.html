<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap to Reveal Tags</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; display: flex;
            justify-content: center; align-items: center;
            overflow: hidden; font-family: Arial, sans-serif; user-select: none;
        }
        #overlay {
            color: #ffffff; font-size: 3rem; cursor: pointer;
            display: flex; align-items: center; gap: 15px;
            transition: opacity 0.4s ease, transform 0.4s ease;
            position: absolute; z-index: 10;
        }
        .triangle { font-size: 2.5rem; }
        #content {
            display: none; opacity: 0; transform: scale(0.95);
            text-align: center; color: white;
            transition: opacity 0.5s ease, transform 0.5s ease; z-index: 5;
        }
        h2 { font-size: 1.8rem; margin-bottom: 25px; color: #aaaaaa; }
        .tag-container { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .user-tag {
            display: inline-block; background: rgba(255, 255, 255, 0.1);
            color: #ffffff; text-decoration: none; padding: 12px 24px;
            border-radius: 30px; font-size: 1.2rem; font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.2s ease; width: 200px;
        }
        .user-tag:hover { background: #ffffff; color: #000000; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="overlay">
        <span class="triangle">▶</span>
        <span>tap</span>
    </div>

    <div id="content">
        <h2>TAGGED FRIENDS</h2>
        <div class="tag-container">
            <!-- Replace these with real usernames -->
            <a href="https://github.com" target="_blank" class="user-tag">@friend1</a>
            <a href="https://github.com" target="_blank" class="user-tag">@friend2</a>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const content = document.getElementById('content');
        overlay.addEventListener('click', () => {
            overlay.style.opacity = '0';
            overlay.style.transform = 'scale(0.8)';
            setTimeout(() => {
                overlay.style.display = 'none';
                content.style.display = 'block';
                setTimeout(() => {
                    content.style.opacity = '1';
                    content.style.transform = 'scale(1)';
                }, 50);
            }, 400);
        });
    </script>
</body>
</html>
